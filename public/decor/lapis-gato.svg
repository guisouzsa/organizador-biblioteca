<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Lápis gato" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .color1 { fill: #808080; }
    .color2 { fill: #919191; }
    .color3 { fill: #a2a2a2; }
    .color4 { fill: #b3b3b3; }
    .color5 { fill: #c4c4c4; }
    .branco { fill: #c4c4c4; }
    .traco  { fill: none; stroke: #c4c4c4; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .borda  { stroke: #808080; stroke-width: 8; stroke-linejoin: round; }
  </style>

  <g transform="translate(0 -12) rotate(-18 200 200) translate(200 200) scale(.92) translate(-200 -200)">
    <!-- orelhas -->
    <path class="color1 borda" d="M142 128 L146 62 L190 112 Z"/>
    <path class="color1 borda" d="M258 128 L254 62 L210 112 Z"/>
    <path class="branco" d="M153 107 L155 83 L173 106 Z"/>
    <path class="branco" d="M247 107 L245 83 L227 106 Z"/>

    <!-- cabeça / corpo do lápis -->
    <path class="color1 borda" d="M140 112 Q200 98 260 112 L262 290 L138 290 Z"/>

    <!-- faixa lateral (sombra) -->
    <path class="color2" d="M232 116 Q248 114 258 116 L260 288 L232 288 Z"/>

    <!-- virola (parte metálica) -->
    <rect class="color3 borda" x="138" y="282" width="124" height="30" rx="4"/>
    <path class="traco" d="M150 297 H250" stroke-width="4" opacity=".8"/>

    <!-- madeira da ponta -->
    <path class="color5 borda" d="M142 312 L258 312 L214 372 L186 372 Z"/>
    <!-- grafite -->
    <path class="color1 borda" d="M186 372 L214 372 L200 392 Z"/>

    <!-- rosto -->
    <path class="branco" d="M180 166 C162 170 160 202 180 210 C170 198 170 178 180 166 Z"/>
    <path class="branco" d="M180 166 C162 170 160 202 180 210 C170 198 170 178 180 166 Z" transform="translate(42 0)"/>
    <circle class="branco" cx="200" cy="206" r="6"/>
    <path class="traco" d="M200 212 V222 M193 230 L200 222 L207 230"/>

    <!-- bigodes -->
    <path class="traco" d="M152 218 L168 214 M152 232 L170 226"/>
    <path class="traco" d="M248 218 L232 214 M248 232 L230 226"/>

    <!-- brilho -->
    <path class="traco" d="M158 130 L176 128 M158 244 V262" stroke-width="5" opacity=".9"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
